<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="utf-8">
    <title>NHNAI — 모바일 조작 프로토타입</title>
    <link rel="stylesheet" href="mobile-controls.css">
</head>
<body>
    <!-- 3D 화면 위에 덮이는 층이다. 여기서는 배경을 어둡게 깔아 대비만 본다 —
         실제 화면(MobileControls.uxml)의 루트는 배경을 칠하지 않는다. -->
    <div class="stage">
        <div class="mobile-controls">

            <!-- 시점 패드. 화면 오른쪽 절반을 덮는 투명한 판이다.
                 조이스틱·버튼보다 **먼저** 와야 뒤에 깔린다 — USS 에 z-index 가
                 없어 겹침 순서가 곧 트리 순서다. -->
            <div class="look-pad">
                <div class="look-pad__hint">끌어서 둘러보기</div>
            </div>

            <!-- 왼손 — 이동 -->
            <div class="joystick">
                <div class="joystick__knob"></div>
            </div>

            <!-- 오른손 — 행동. 엄지가 닿는 구석에 모은다 -->
            <div class="action-pad">
                <div class="action-pad__minor">
                    <button class="action-button action-button--minor action-button--stacked">꺼내기</button>
                    <button class="action-button action-button--minor">넣기</button>
                </div>
                <button class="action-button action-button--major">사용</button>
            </div>

            <!-- ↓ HUD(Hud.uxml)가 그리는 것. 여기서는 자리만 확인한다.
                 모바일에서는 개수가 우측 하단이면 행동 버튼에 가린다 —
                 그래서 .hud--mobile 이 우측 상단으로 올린다 -->
            <div class="hud-ghost">7</div>

            <div class="reticle-ghost"></div>
        </div>
    </div>
</body>
</html>
