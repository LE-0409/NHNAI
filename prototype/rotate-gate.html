<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="utf-8">
    <title>NHNAI — 세로 화면 안내 프로토타입</title>
    <link rel="stylesheet" href="rotate-gate.css">
</head>
<body>
    <!-- 세로로 든 화면을 막는 층. **모든 층 위에 덮인다** (sortingOrder 30 —
         메인메뉴 20 보다도 위다).

         메인메뉴의 스크림과 달리 **불투명하게 덮는다.** 메뉴는 뒤로 방이 비쳐야
         "메뉴가 걷힌다"로 읽히지만, 이 층은 반대다 — 뒤가 비치면 세로로도 놀 수
         있어 보여서 손가락이 화면으로 간다. 지금은 놀 수 없다는 것이 메시지다.

         브라우저에서 창을 세로로 좁혀 확인한다. 실제로도 판단 기준은 같다:
         패널 높이 > 너비. -->
    <div class="stage">

        <!-- 이 트리가 곧 RotateGate.uxml 이다. div → VisualElement, 텍스트 → Label.
             아이콘은 ::before 없이 실제 자식 둘로 만든다 — USS 에 의사 요소가 없다. -->
        <div class="rotate-gate">
            <div class="rotate-gate__phone" id="phone">
                <div class="rotate-gate__phone-screen"></div>
            </div>
            <div class="rotate-gate__title">ROTATE YOUR DEVICE</div>
            <div class="rotate-gate__note">LANDSCAPE ONLY</div>
        </div>
    </div>

    <script>
        // 회전 힌트. USS 에는 @keyframes 가 없어서 **클래스를 껐다 켜고 transition 이
        // 그린다**. 정본은 RotateGateScreen.cs 의 schedule.Every 이고, 여기 JS 는
        // 같은 것을 브라우저에서 보기 위한 거울이다 — 주기와 클래스 이름을 맞춰 둔다.
        const TurnEveryMs = 1400;
        const phone = document.getElementById('phone');
        setInterval(() => phone.classList.toggle('rotate-gate__phone--turned'), TurnEveryMs);
    </script>
</body>
</html>
