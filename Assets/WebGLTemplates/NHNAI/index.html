<!DOCTYPE html>
<!--
  NHNAI WebGL 템플릿 — 캔버스가 뷰포트를 꽉 채운다.

  Unity 기본(Default) 템플릿은 고정 크기 캔버스에 로고 푸터가 붙어서, GitHub Pages
  에 올리면 페이지 한가운데 작은 박스로 뜬다. 1920x1080 기준으로 잡은 UI 가 그
  박스 안에서 조밀해진다. 그래서 직접 만든다.

  기본(Minimal) 템플릿과 다른 점:

    · 모바일에서만 꽉 채우지 않는다. 기본 템플릿은 userAgent 로 iPhone/Android 를
      가려내 그때만 100% 로 늘리는데, 그러면 데스크톱 브라우저에서 작은 박스로 남고
      태블릿·새 기기는 정규식에서 새어 나간다. 여기서는 항상 뷰포트를 채운다.

    · **터치 제스처를 막는다** (`touch-action: none`, `overscroll-behavior: none`).
      이게 없으면 시점 패드를 끄는 순간 브라우저가 페이지를 스크롤하거나
      당겨서-새로고침이 걸린다. 손가락으로 도는 게임이라 이 한 줄이 조작을 좌우한다.

    · **devicePixelRatio 를 2 로 제한한다.** 폰의 DPR 은 3~4 라 뷰포트를 채우면
      렌더 타깃이 순식간에 커진다. 이 게임은 Bloom · SMAA · FilmGrain 을 다 켠
      상태라 그대로 두면 프레임이 안 나온다. 선명함이 아쉬우면 이 값부터 올린다.

  ⚠️ 중괄호 세 겹 매크로와 #if 블록은 Unity 6.3 의 Minimal 템플릿에서 그대로 가져왔다.
     이름을 지어내면 빌드가 조용히 빈 URL 을 넣는다.
     원본: <Unity>/Editor/Data/PlaybackEngines/WebGLSupport/BuildTools/WebGLTemplates/Base/Minimal

  ⚠️ 이 주석에 매크로 문법을 그대로 적지 않는다. 전처리기는 HTML 주석을 가리지 않고
     파일 전체를 정규식으로 훑어서(BuildTools/Preprocess.js:63) 주석 안의 것까지
     평가한다. 값이 없는 매크로는 undefined 가 되고 .toString() 에서 빌드가 선다 —
     설명하려고 적은 빈 매크로 하나가 실제로 빌드를 세웠다.
-->
<html lang="ko">
  <head>
    <meta charset="utf-8">
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
    <!-- viewport-fit=cover: 노치가 있는 기기에서도 캔버스가 끝까지 간다.
         user-scalable=no: 두 손가락 확대가 조작(조이스틱 + 시점)과 겹친다. -->
    <meta name="viewport" content="width=device-width, height=device-height, initial-scale=1.0, user-scalable=no, shrink-to-fit=yes, viewport-fit=cover">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <title>{{{ PRODUCT_NAME }}}</title>
#if SHOW_DIAGNOSTICS
    <link rel="stylesheet" href="<<<TemplateData/diagnostics.css>>>">
    <script src="<<<TemplateData/diagnostics.js>>>"></script>
#endif
    <style>
      html, body {
        width: 100%;
        height: 100%;
        margin: 0;
        padding: 0;
        overflow: hidden;
        background: {{{ BACKGROUND_COLOR }}};
        /* 게임 화면 위의 텍스트 선택·길게눌러 사전찾기·당겨서 새로고침을 막는다 */
        overscroll-behavior: none;
        -webkit-user-select: none;
        user-select: none;
        -webkit-touch-callout: none;
        -webkit-tap-highlight-color: transparent;
      }

      #unity-canvas {
        display: block;
        width: 100%;
        height: 100%;
        /* 브라우저가 스크롤·확대로 가로채지 않고 손가락을 캔버스로 넘긴다.
           모바일 조작(조이스틱 · 시점 패드)이 이것에 걸려 있다 */
        touch-action: none;
        background: {{{ BACKGROUND_FILENAME ? 'url(\'Build/' + BACKGROUND_FILENAME.replace(/'/g, '%27') + '\') center / cover' : BACKGROUND_COLOR }}};
      }

      /* 로딩 표시. 이미지를 쓰지 않아 템플릿 폴더가 index.html 하나로 끝난다 */
      #loading {
        position: fixed;
        left: 0;
        top: 0;
        width: 100%;
        height: 100%;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        background: {{{ BACKGROUND_COLOR }}};
        transition: opacity 300ms ease-out;
      }

      #loading.done {
        opacity: 0;
        pointer-events: none;
      }

      #loading-label {
        font-family: system-ui, -apple-system, sans-serif;
        font-size: 13px;
        letter-spacing: 5px;
        color: rgb(198, 198, 202);
        margin-bottom: 18px;
      }

      #loading-track {
        width: 220px;
        height: 2px;
        background: rgba(226, 226, 226, 0.16);
      }

      #loading-fill {
        width: 0%;
        height: 100%;
        background: rgb(226, 226, 226);
      }

      #error {
        position: fixed;
        left: 0;
        top: 0;
        width: 100%;
        height: 100%;
        display: none;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        padding: 24px;
        box-sizing: border-box;
        background: {{{ BACKGROUND_COLOR }}};
        font-family: system-ui, -apple-system, sans-serif;
        font-size: 14px;
        line-height: 1.7;
        color: rgb(198, 198, 202);
        text-align: center;
        white-space: pre-wrap;
      }
#if SHOW_DIAGNOSTICS
      #diagnostics-icon {
        position: fixed;
        bottom: 10px;
        right: 0;
      }
#endif
    </style>
  </head>
  <body>
    <canvas id="unity-canvas" tabindex="-1"></canvas>

    <div id="loading">
      <div id="loading-label">LOADING</div>
      <div id="loading-track"><div id="loading-fill"></div></div>
    </div>

    <div id="error"></div>
#if SHOW_DIAGNOSTICS
    <img id="diagnostics-icon" src="TemplateData/webmemd-icon.png">
#endif

    <script src="Build/{{{ LOADER_FILENAME }}}"></script>
    <script>
      // 폰의 DPR 은 3~4 다. 뷰포트를 꽉 채운 채로 그대로 쓰면 렌더 타깃이 커져
      // 포스트 프로세싱이 감당을 못 한다. 올리면 선명해지고 느려진다.
      var MaxPixelRatio = 2;

      var canvas = document.querySelector("#unity-canvas");
      var loading = document.querySelector("#loading");
      var loadingFill = document.querySelector("#loading-fill");

      // 캔버스 위 우클릭 메뉴는 조작을 가린다 ('사용'을 오래 누르면 뜬다).
      canvas.addEventListener("contextmenu", function (e) { e.preventDefault(); });

      function showError(message) {
        var box = document.querySelector("#error");
        box.style.display = "flex";
        box.textContent = message;
        loading.classList.add("done");
      }

      createUnityInstance(canvas, {
        arguments: [],
        dataUrl: "Build/{{{ DATA_FILENAME }}}",
        frameworkUrl: "Build/{{{ FRAMEWORK_FILENAME }}}",
#if USE_THREADS
        workerUrl: "Build/{{{ WORKER_FILENAME }}}",
#endif
#if USE_WASM
        codeUrl: "Build/{{{ CODE_FILENAME }}}",
#endif
#if SYMBOLS_FILENAME
        symbolsUrl: "Build/{{{ SYMBOLS_FILENAME }}}",
#endif
        streamingAssetsUrl: "StreamingAssets",
        companyName: {{{ JSON.stringify(COMPANY_NAME) }}},
        productName: {{{ JSON.stringify(PRODUCT_NAME) }}},
        productVersion: {{{ JSON.stringify(PRODUCT_VERSION) }}},
        devicePixelRatio: Math.min(window.devicePixelRatio || 1, MaxPixelRatio),
      }, function (progress) {
        loadingFill.style.width = (progress * 100) + "%";
      }).then(function (unityInstance) {
        loading.classList.add("done");
#if SHOW_DIAGNOSTICS
        document.getElementById("diagnostics-icon").onclick = function () {
          unityDiagnostics.openDiagnosticsDiv(unityInstance.GetMetricsInfo);
        };
#endif
      }).catch(function (message) {
        // alert() 로 띄우면 모바일에서 전문이 잘린다. 압축/헤더 문제일 때 이 글이
        // 그대로 원인이라 다 보여야 한다.
        showError(message);
      });
    </script>
  </body>
</html>
